minimum_pre_commit_version: "4.4.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
        stages: [pre-commit]
