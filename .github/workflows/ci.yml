name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run --locked pre-commit validate-config
      - name: Validate configuration files and filenames
        env:
          SKIP: ruff-check,ruff-format,ty-check
        run: uv run --locked pre-commit run --all-files
      - run: uv run --locked ty check
      - run: uv run --locked ruff check . && uv run --locked ruff format --check . && uv run --locked pytest
