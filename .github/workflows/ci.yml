name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run --locked pre-commit validate-config
      - run: uv run --locked ruff check . && uv run --locked ruff format --check . && uv run --locked pytest
      - name: Reject new migration exceptions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/check_migration_exceptions.py --base-ref "$BASE_SHA"
